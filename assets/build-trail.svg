<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jai's build trail</title>
  <desc id="desc">A four-stage timeline from operating fintech and payments businesses, through building AI systems and open-source tools, to partnering with founders.</desc>
  <rect width="1200" height="500" rx="24" fill="#111318"/>
  <path d="M0 64H1200M0 436H1200" stroke="#2B3039"/>
  <path d="M70 0V500M1130 0V500" stroke="#2B3039"/>
  <path d="M930 -80L1260 250" stroke="#B8F34A" stroke-width="86" opacity="0.06"/>

  <rect x="70" y="46" width="164" height="32" rx="16" fill="#B8F34A"/>
  <text x="152" y="67" text-anchor="middle" fill="#111318" font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="2">THE BUILD TRAIL</text>
  <text x="70" y="142" fill="#F5F1E8" font-family="Georgia, serif" font-size="48" font-weight="700" letter-spacing="-1.5">From operator to systems builder.</text>
  <text x="72" y="179" fill="#ADB7C7" font-family="Courier New, monospace" font-size="15" letter-spacing="1">REAL WORK → REPEATABLE SYSTEMS → PUBLIC PROOF → FOUNDER PARTNERSHIP</text>

  <path d="M150 250H1050" stroke="#4B5563" stroke-width="2"/>
  <path d="M150 250H1050" stroke="#B8F34A" stroke-width="2" stroke-dasharray="8 12" opacity="0.7"/>

  <g>
    <circle cx="150" cy="250" r="25" fill="#111318" stroke="#B8F34A" stroke-width="2"/>
    <text x="150" y="255" text-anchor="middle" fill="#B8F34A" font-family="Courier New, monospace" font-size="13" font-weight="700">01</text>
    <text x="70" y="306" fill="#B8F34A" font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="2">OPERATE</text>
    <text x="70" y="340" fill="#F5F1E8" font-family="Georgia, serif" font-size="24" font-weight="700">19 years in the work</text>
    <text x="70" y="370" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">Fintech, payments, product</text>
    <text x="70" y="392" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">and business operations.</text>
  </g>

  <g>
    <circle cx="450" cy="250" r="25" fill="#111318" stroke="#B8F34A" stroke-width="2"/>
    <text x="450" y="255" text-anchor="middle" fill="#B8F34A" font-family="Courier New, monospace" font-size="13" font-weight="700">02</text>
    <text x="370" y="306" fill="#B8F34A" font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="2">BUILD</text>
    <text x="370" y="340" fill="#F5F1E8" font-family="Georgia, serif" font-size="24" font-weight="700">Turn friction into tools</text>
    <text x="370" y="370" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">AI systems for trading, careers,</text>
    <text x="370" y="392" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">sales and creative work.</text>
  </g>

  <g>
    <circle cx="750" cy="250" r="25" fill="#111318" stroke="#B8F34A" stroke-width="2"/>
    <text x="750" y="255" text-anchor="middle" fill="#B8F34A" font-family="Courier New, monospace" font-size="13" font-weight="700">03</text>
    <text x="670" y="306" fill="#B8F34A" font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="2">OPEN</text>
    <text x="670" y="340" fill="#F5F1E8" font-family="Georgia, serif" font-size="24" font-weight="700">Make the proof public</text>
    <text x="670" y="370" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">Open-source products, releases,</text>
    <text x="670" y="392" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">tests and working demos.</text>
  </g>

  <g>
    <circle cx="1050" cy="250" r="25" fill="#B8F34A"/>
    <text x="1050" y="255" text-anchor="middle" fill="#111318" font-family="Courier New, monospace" font-size="13" font-weight="700">04</text>
    <text x="970" y="306" fill="#B8F34A" font-family="Courier New, monospace" font-size="12" font-weight="700" letter-spacing="2">PARTNER</text>
    <text x="970" y="337" fill="#F5F1E8" font-family="Georgia, serif" font-size="22" font-weight="700">Build beside</text>
    <text x="970" y="362" fill="#F5F1E8" font-family="Georgia, serif" font-size="22" font-weight="700">founders</text>
    <text x="970" y="387" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">Product judgment,</text>
    <text x="970" y="409" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">technical execution,</text>
    <text x="970" y="431" fill="#ADB7C7" font-family="Georgia, serif" font-size="14">and operating rhythm.</text>
  </g>
</svg>
